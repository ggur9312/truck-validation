<!doctype html>
<html>
<head><meta charset="utf-8"><title>Mock WMS</title></head>
<body>
  <input name="toteBarcode" />
  <w-date-range-input id="date-range-input" block="" size="medium" startdate="2026-07-13" enddate="2026-07-13">
    <span slot="hidden" data-hidden=""><input shadow-input="" type="text" /></span>
  </w-date-range-input>
  <button id="search" onclick="doSearch()">조회</button>

  <table id="vendorReturnTotePage">
    <tbody></tbody>
  </table>

  <script>
    // real WMS only shows the reprint button once a waybill has actually been
    // generated for that tote; TOTE_REPRINT is preset to simulate a tote that
    // already has one from an earlier session.
    var generatedTotes = { TOTE_REPRINT: true };
    function doSearch(){
      var tote = document.querySelector('input[name="toteBarcode"]').value || 'TOTE001';
      var table = document.querySelector('#vendorReturnTotePage tbody');
      // TOTE_NONE simulates a tote with no matching results: like most
      // real table UIs, an explicit "no data" row is rendered rather than
      // leaving the table completely untouched (a literal no-op re-render
      // produces no DOM mutation at all, which nothing can observe).
      // Searching the same real tote twice in a row must still render
      // byte-identical markup both times (no artificial per-search
      // uniqueness), since that's the scenario that used to hang.
      if (tote === 'TOTE_NONE') { table.innerHTML = '<tr><td colspan="11">조회된 내역이 없습니다</td></tr>'; return; }
      var actionBtn = generatedTotes[tote]
        ? '<button class="btn-waybill-print-single" onclick="openReprintModal()">재출력</button>'
        : '<button data-action="open-waybill-modal" onclick="openWaybillModal(\'' + tote + '\')">운송장생성</button>';
      table.innerHTML = '<tr>' +
        '<td><a href="/detail/' + tote + '">상세1</a></td>' +
        '<td>2</td>' +
        '<td><a href="/type/' + tote + '">타입1</a></td>' +
        '<td>4</td><td>5</td><td>6</td><td>7</td><td>8</td><td>9</td><td>10</td>' +
        '<td>' + actionBtn + '</td>' +
        '</tr>';
    }
    function openWaybillModal(tote){
      var d = document.createElement('dialog');
      var mismatch = location.search.indexOf('mismatch=1') !== -1;
      d.className = mismatch ? 'unknown-dialog-xyz' : 'waybill-dialog';
      d.innerHTML = '<input id="waybill-modal-barcode-input"/>' +
        '<button id="waybill-modal-submit" onclick="generatedTotes[\'' + tote + '\']=true; var dlg=this.closest(\'dialog\'); dlg.close(); dlg.remove();">생성</button>' +
        '<button id="manual-close-x" onclick="this.closest(\'dialog\').close();">직접닫기(재출력X)</button>';
      document.body.appendChild(d);
      d.showModal();
    }
    function openReprintModal(){
      var d = document.createElement('div');
      d.id = 'modalWaybillPrintList';
      d.innerHTML = '<button id="waybill-print-all" onclick="document.getElementById(\'modalWaybillPrintList\').remove()">전체출력</button>';
      document.body.appendChild(d);
    }
  </script>

  <!-- detail pages served as separate routes below, simulated via fetch intercept in test -->
</body>
</html>
